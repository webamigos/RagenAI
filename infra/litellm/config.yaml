# LiteLLM Proxy Configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ---------------------------------------------------------------------------
  # OpenAI / Anthropic (direct) — the fastest path to a working model for a
  # local self-hosted install: one API key, no cloud account to provision.
  # `npx create-ragen-app` wires one of these in automatically (uncommented,
  # with your key) when you pick a provider during setup — see
  # packages/create-ragen-app/src/llm-provider.ts, which is what these two
  # entries must stay in sync with. Uncomment one yourself for a manual setup
  # instead of the CLI.
  # ---------------------------------------------------------------------------
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

  # - model_name: claude-haiku-4-5
  #   litellm_params:
  #     model: anthropic/claude-haiku-4-5-20251001
  #     api_key: os.environ/ANTHROPIC_API_KEY

  # ---------------------------------------------------------------------------
  # Azure OpenAI — GPT models (chat only, no codex/image/audio)
  # ---------------------------------------------------------------------------
  - model_name: gpt-5.4
    litellm_params:
      model: azure/gpt-5.4
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
      base_model: gpt-5.4

  # - model_name: gpt-5.4-mini
  #   litellm_params:
  #     model: azure/gpt-5.4-mini
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: os.environ/AZURE_API_VERSION
  #     base_model: gpt-5.4-mini

  # - model_name: gpt-5.4-nano
  #   litellm_params:
  #     model: azure/gpt-5.4-nano
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: os.environ/AZURE_API_VERSION
  #     base_model: gpt-5.4-nano

  # - model_name: gpt-5.3-chat
  #   litellm_params:
  #     model: azure/gpt-5.3-chat
  #     api_base: os.environ/AZURE_API_BASE
  #     api_key: os.environ/AZURE_API_KEY
  #     api_version: os.environ/AZURE_API_VERSION
  #     base_model: gpt-5.3-chat

  # GPT-5.6 (added 2026-09-05): superseded gpt-5.4 as the current GPT tier.
  # Three variants — Sol (top reasoning), Terra (balanced, ~GPT-5.5-class at
  # lower cost — the closest match to how gpt-5.4 is used here), Luna
  # (cheapest/fastest). All three Azure deployments (named "gpt-5.6-luna",
  # "gpt-5.6-terra", "gpt-5.6-sol" — confirmed live 2026-09-05, so `model:`
  # below is a real deployment name, not an assumption) are still untested end
  # to end in this environment: AZURE_API_KEY / AZURE_API_BASE are unset
  # locally (commented out in .env.local), same as the pre-existing gpt-5.4
  # entry — re-run the smoke chat-completion call once real Azure credentials
  # are available locally or in staging.
  - model_name: gpt-5.6-sol
    litellm_params:
      model: azure/gpt-5.6-sol
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
      base_model: gpt-5.6-sol

  - model_name: gpt-5.6-terra
    litellm_params:
      model: azure/gpt-5.6-terra
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
      base_model: gpt-5.6-terra

  - model_name: gpt-5.6-luna
    litellm_params:
      model: azure/gpt-5.6-luna
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
      base_model: gpt-5.6-luna

  # ---------------------------------------------------------------------------
  # AWS Bedrock — Anthropic Claude models
  # ---------------------------------------------------------------------------
  # Cross-region inference profiles (eu. prefix required for newer models)
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/eu.anthropic.claude-sonnet-4-6
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_BEDROCK_REGION

  # - model_name: claude-opus-4-6
  #   litellm_params:
  #     model: bedrock/eu.anthropic.claude-opus-4-6-v1
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  #     aws_region_name: os.environ/AWS_BEDROCK_REGION

  # - model_name: claude-haiku-4-5
  #   litellm_params:
  #     model: bedrock/eu.anthropic.claude-haiku-4-5-20251001-v1:0
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  #     aws_region_name: os.environ/AWS_BEDROCK_REGION

  # Claude Sonnet 5 / Opus 5 (added 2026-09-05) — current-generation successors
  # to claude-sonnet-4-6 above. Bedrock model IDs verified against AWS's own
  # model cards (docs.aws.amazon.com/bedrock, "Claude Sonnet 5"/"Claude Opus 5"
  # pages): EU geo cross-region inference profile, no version suffix — same
  # shape as the active claude-sonnet-4-6 entry. Sonnet 5 is priced lower than
  # Sonnet 4.6 ($2/$10 vs $3/$15 per 1M tokens) at higher capability, so it is
  # a strict upgrade for anything currently pointed at claude-sonnet-4-6.
  # Live-tested 2026-09-05 against local AWS credentials via a real
  # /v1/chat/completions call: routing/model-ID plumbing confirmed correct —
  # Bedrock's response was "anthropic.claude-sonnet-5/-opus-5 is not available
  # for this account" (an access-grant error, not an invalid-model-ID error),
  # so the IDs above are real. This AWS account's Bedrock console just hasn't
  # granted model access to Sonnet 5 / Opus 5 yet — do that before relying on
  # either in production, then re-run the same curl to confirm end-to-end.
  # Left active here (the proxy route costs nothing while unused) but hidden
  # from the org model picker via `visible: false` in
  # packages/platform-contracts/src/llm/model-catalog.ts until access is
  # confirmed — flip that flag back to true once the console grants access.
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/eu.anthropic.claude-sonnet-5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_BEDROCK_REGION

  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/eu.anthropic.claude-opus-5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_BEDROCK_REGION

  # ---------------------------------------------------------------------------
  # Google Vertex AI — Gemini models
  # Vertex credentials: set VERTEX_CREDENTIALS env var to the full JSON content
  # of your GCP service account key (for Railway/cloud deployments where file
  # mounts are not available).
  # ---------------------------------------------------------------------------

  # --- Gemini 3.x models (global — preview models require this region) ---
  - model_name: gemini-3-flash-preview
    litellm_params:
      model: vertex_ai/gemini-3-flash-preview
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: global
      vertex_credentials: os.environ/VERTEX_CREDENTIALS

  # --- Stable models (VERTEX_LOCATION env var — typically europe-west1 for EU) ---
  # - model_name: gemini-2.5-pro
  #   litellm_params:
  #     model: vertex_ai/gemini-2.5-pro
  #     vertex_project: os.environ/VERTEX_PROJECT
  #     vertex_location: os.environ/VERTEX_LOCATION
  #     vertex_credentials: os.environ/VERTEX_CREDENTIALS

  - model_name: gemini-2.5-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION
      vertex_credentials: os.environ/VERTEX_CREDENTIALS

  # - model_name: gemini-2.5-flash-lite
  #   litellm_params:
  #     model: vertex_ai/gemini-2.5-flash-lite
  #     vertex_project: os.environ/VERTEX_PROJECT
  #     vertex_location: os.environ/VERTEX_LOCATION
  #     vertex_credentials: os.environ/VERTEX_CREDENTIALS

  # ---------------------------------------------------------------------------
  # Scaleway Generative APIs (OpenAI-compatible)
  # Endpoint: https://api.scaleway.ai/{SCW_PROJECT_ID}/v1
  # API key: Scaleway IAM secret key with GenerativeApisFullAccess
  # Docs: https://www.scaleway.com/en/docs/generative-apis/
  # ---------------------------------------------------------------------------
  # Pricing in EUR per single token, sourced from Scaleway pricing page
  # https://www.scaleway.com/en/pricing/?tags=managedservices-genai
  - model_name: gpt-oss-120b
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_API_KEY
      input_cost_per_token: 0.00000015 # €0.15 / 1M
      output_cost_per_token: 0.0000006 # €0.60 / 1M

  - model_name: mistral-small-3.2
    litellm_params:
      model: openai/mistral-small-3.2-24b-instruct-2506
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_API_KEY
      input_cost_per_token: 0.00000015 # €0.15 / 1M
      output_cost_per_token: 0.00000035 # €0.35 / 1M

  # Embeddings — NOTE: bge-multilingual-gemma2 has 3584 dimensions.
  # Switching from cohere-embed-multilingual-v3 (1024 dims) requires wiping and
  # reindexing all Qdrant collections — schema has `size: 1024` hardcoded.
  - model_name: bge-multilingual-gemma2
    litellm_params:
      model: openai/bge-multilingual-gemma2
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_API_KEY
      # Scaleway's vLLM endpoint rejects `encoding_format: null`. LiteLLM
      # rebuilds the upstream request body and drops the client-side field
      # we set in src/libs/llm/embeddings-factory.ts, so we pin it here.
      encoding_format: float
      input_cost_per_token: 0.0000001 # €0.10 / 1M
      output_cost_per_token: 0 # output is free per Scaleway

  # Reranker via Scaleway. Endpoint /v1/rerank is Cohere/Jina-compatible.
  # NOTE: Scaleway's "rerank" is a bi-encoder (cosine similarity on
  # qwen3-embedding-8b vectors), not a true cross-encoder — quality is lower
  # than Cohere Rerank v3.5.
  - model_name: qwen3-embedding-8b
    litellm_params:
      model: cohere/qwen3-embedding-8b
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_API_KEY
      input_cost_per_token: 0.0000001 # €0.10 / 1M (embedding rate; verify)
      output_cost_per_token: 0

  # ---------------------------------------------------------------------------
  # Reranking
  # ---------------------------------------------------------------------------
  # - model_name: cohere-rerank-v3-5
  #   litellm_params:
  #     model: bedrock/arn:aws:bedrock:eu-central-1::foundation-model/cohere.rerank-v3-5:0
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  #     aws_region_name: os.environ/AWS_BEDROCK_REGION

  # ---------------------------------------------------------------------------
  # Embeddings
  # ---------------------------------------------------------------------------
  # - model_name: cohere-embed-multilingual-v3
  #   litellm_params:
  #     model: bedrock/cohere.embed-multilingual-v3
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  #     aws_region_name: os.environ/AWS_BEDROCK_REGION

litellm_settings:
  # Drop unmapped params instead of failing
  drop_params: true
  # Enable detailed request/response logging in debug mode
  set_verbose: false
  # Cache settings (in-memory for local dev)
  cache: false
  # Langfuse tracing — logs all LLM calls (chat + embeddings) to Langfuse
  # Requires LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_HOST env vars
  success_callback: ['langfuse']
  failure_callback: ['langfuse']

router_settings:
  # No model fallbacks. We previously routed gpt-oss-120b → mistral-small-3.2
  # as "defense-in-depth" for multimodal, but the fallback fires on ANY
  # upstream error (not just multimodal 400), so reasoning_effort/payload
  # issues silently masked the real model in usage logs. The in-app
  # multimodal swap (chat-completion-factory.ts → maybeRewriteModelForMultimodal,
  # gated by MULTIMODAL_TEXT_ONLY_MODELS / MULTIMODAL_FALLBACK_MODEL env vars)
  # is the correct place for that swap because it inspects content parts.

general_settings:
  # Master key — set LITELLM_MASTER_KEY env var for staging/production
  # When unset, the proxy runs without auth (local dev)
  master_key: os.environ/LITELLM_MASTER_KEY
  # Store usage, keys, and teams in Postgres
  database_url: os.environ/LITELLM_DATABASE_URL
