# Runs Ragen's own applications in containers, on top of the backing services
# defined in docker-compose.yml. Always used together with that file:
#
#   docker compose -f docker-compose.yml -f docker-compose.fullapp.yml up --build
#   # or simply: npm run ragen:up:everything
#
# Why this exists: Ragen is self-hosted software, and until now `docker compose
# up` gave you only the dependencies — Postgres, Qdrant, Docling, Redis —
# while web/api/worker/admin still had to be started by hand on the host. Evaluating or deploying Ragen should not require a Node toolchain.
#
# Every build context is the repository root, because the lockfile, the shared
# Prisma schema and the workspace packages all live there.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ragen-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      # Service names, not localhost: these resolve on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pass123}@postgres:5432/${POSTGRES_DB:-ragen}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      RAGEN_API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
      # Empty unless you set them, which is what keeps PII masking opt-in —
      # availability follows these two URLs. They are passed through at all
      # because the variables never reached these containers before, so masking
      # could not work in this stack even when someone asked for it: the web
      # app's old built-in default pointed at its own localhost.
      #
      # On this network the values are the service names:
      #   PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      #   PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      # and the services themselves need `--profile pii`.
      PRESIDIO_ANALYZER_URL: ${PRESIDIO_ANALYZER_URL:-}
      PRESIDIO_ANONYMIZER_URL: ${PRESIDIO_ANONYMIZER_URL:-}
      FEATURE_FLAG_PII_MASKING: ${FEATURE_FLAG_PII_MASKING:-}
      BETTER_AUTH_URL: http://localhost:${WEB_PORT:-3000}
      TARGET_ENV: ${TARGET_ENV:-local}
      # The same volume the worker writes to. Without this the app cannot read
      # the documents the worker ingests — the exact failure ADR-27 describes.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - storage_data:/data/storage
      # The LLM route table, mounted rather than baked in — the same shape as
      # the proxy's config file used to be. This is what makes the table
      # configuration: editing it and restarting the container is a change a
      # deployment can make, where a table compiled into the image would need
      # the source tree and a rebuild. Read-only; the app never writes it.
      - ./infra/llm-gateway:/app/infra/llm-gateway:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - ragen-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ragen-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pass123}@postgres:5432/${POSTGRES_DB:-ragen}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      RAGEN_APP_INTERNAL_URL: http://web:3000
      TARGET_ENV: ${TARGET_ENV:-local}
      # The same volume the worker writes to. Without this the app cannot read
      # the documents the worker ingests — the exact failure ADR-27 describes.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - storage_data:/data/storage
      # The LLM route table, mounted rather than baked in — the same shape as
      # the proxy's config file used to be. This is what makes the table
      # configuration: editing it and restarting the container is a change a
      # deployment can make, where a table compiled into the image would need
      # the source tree and a rebuild. Read-only; the app never writes it.
      - ./infra/llm-gateway:/app/infra/llm-gateway:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragen-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ragen-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pass123}@postgres:5432/${POSTGRES_DB:-ragen}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      DOCLING_URL: http://docling:5001
      RAGEN_APP_URL: http://web:3000
      # Empty unless you set them, which is what keeps PII masking opt-in —
      # availability follows these two URLs. They are passed through at all
      # because the variables never reached these containers before, so masking
      # could not work in this stack even when someone asked for it: the web
      # app's old built-in default pointed at its own localhost.
      #
      # On this network the values are the service names:
      #   PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      #   PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      # and the services themselves need `--profile pii`.
      PRESIDIO_ANALYZER_URL: ${PRESIDIO_ANALYZER_URL:-}
      PRESIDIO_ANONYMIZER_URL: ${PRESIDIO_ANONYMIZER_URL:-}
      FEATURE_FLAG_PII_MASKING: ${FEATURE_FLAG_PII_MASKING:-}
      TARGET_ENV: ${TARGET_ENV:-local}
      # Both sides must agree on this volume, or the worker writes documents the
      # app cannot read — see ADR-27.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - storage_data:/data/storage
      # The LLM route table, mounted rather than baked in — the same shape as
      # the proxy's config file used to be. This is what makes the table
      # configuration: editing it and restarting the container is a change a
      # deployment can make, where a table compiled into the image would need
      # the source tree and a rebuild. Read-only; the app never writes it.
      - ./infra/llm-gateway:/app/infra/llm-gateway:ro
    depends_on:
      postgres:
        condition: service_healthy
      # The queues live in Redis now (ADR-44), so this is the dependency that
      # decides whether the worker can consume anything at all.
      redis:
        condition: service_started
    networks:
      - ragen-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: ragen-admin
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-3200}:3200'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pass123}@postgres:5432/${POSTGRES_DB:-ragen}
      TARGET_ENV: ${TARGET_ENV:-local}
    volumes:
      # Same reasoning as the other three: the route table is configuration, so
      # it is mounted rather than built in.
      - ./infra/llm-gateway:/app/infra/llm-gateway:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragen-network

volumes:
  storage_data:
