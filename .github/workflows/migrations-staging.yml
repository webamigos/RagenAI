name: Migrations on staging

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

on:
  push:
    # paths: # commented temporary for test
    #   # Only run this workflow when migrations are updated
    #   - prisma/migrations/**
    #   - supabase/migrations/**
    branches: [dev]

jobs:
  deploy-on-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

      - name: Apply all pending migrations to the database
        run: npx prisma migrate deploy

      - name: Apply all pending migrations to the vector store
        run: npm run vectorstore:migrate
