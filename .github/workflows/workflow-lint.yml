name: Workflow Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

concurrency:
  # Pull requests share a group per ref, so a follow-up push cancels the
  # run it superseded. Everything else — a push to main, a schedule — gets
  # a group of its own via run_id. Sharing one with cancel-in-progress off
  # does not run them in parallel: GitHub queues the second as pending and
  # cancels any earlier pending run, so two quick pushes to main would lose
  # the middle result instead of recording it.
  group: workflow-lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
