name: Jobs Parity

# The same integration suite, against both job runtimes.
#
# ADR-44 made BullMQ the worker and left Temporal as an adapter that Phase G
# moves to `ragen-enterprise`. The spec's §8.3 defines what "supported" means
# for a runtime nobody installs by default, and this job is the definition's
# load-bearing half: *a runtime nothing runs in CI is not supported, it is
# abandoned with a package name.* Its failure mode is specific — a change to
# `ctx.steps`, `JobContext` or a handler that still passes on BullMQ and breaks
# durable retries — and nothing else in this repository would notice.
#
# **Cheap now, expensive after Phase G.** While the adapter lives here the
# suite, the handlers and the workflows are all in one checkout, so this is one
# workflow file. When the adapter moves, this job moves with it and has to
# resolve two repositories at a pinned pair of versions. Read that as an
# argument for keeping it green rather than for postponing it.
#
# **G2 has moved it, and this copy has not gone yet.**
# `webamigos/ragen-enterprise`'s `temporal-parity.yml` now runs the same suite
# against the adapter that repository ships: it checks this repository out at
# `main`, builds the adapter against *this* checkout's `@ragenai/jobs` and
# splices the build into `node_modules` before running
# `npm run worker:test:jobs`. Both jobs exist on purpose while both copies of
# the adapter do — the one an install uses is still this one, and the two stop
# being redundant at G3. Whatever G3 does to this file,
# `every-job-runtime-is-exercised.test.ts` reads its matrix, so the guard has to
# move with it rather than be deleted.
on:
  schedule:
    # 04:00 UTC — after the nightly E2E (02:00) and mutation (03:00) runs, so
    # three long jobs do not contend for runners.
    - cron: '0 4 * * *'
  workflow_dispatch:
  # On a pull request, for the files whose breakage this job is the sole
  # detector of: the seam, the adapter, the two Temporal-only modules in the
  # worker, the workflow wrappers, the handlers, and this job's own
  # configuration.
  #
  # **The handlers are in, and the first draft had them out.** The argument for
  # leaving them out was that they change often and `Jobs Integration` already
  # runs them against BullMQ on every PR, so adding them here would double that
  # cost for a regression the nightly run would report within a day. Then the
  # job ran: 1m44s and 1m45s, the two *fastest* checks on the pull request that
  # added it, against 4m47s for `Test` and 4m59s for `test-e2e`. The cost
  # argument was a guess, and the measurement does not support it — while a
  # handler is the most likely place for a Temporal-only break to come from,
  # since `ctx.steps` is `proxyActivities` there and an in-process retry loop
  # here.
  pull_request:
    paths:
      - 'packages/jobs/**'
      - 'packages/jobs-temporal/**'
      - 'apps/worker/src/handlers/**'
      # The Temporal-only source outside the adapter package, which nothing
      # else in CI looks at on a pull request: `temporal-failure.ts` is the
      # activity boundary where `JobFailure` becomes `ApplicationFailure`,
      # `temporal-runtime.ts` is the worker bootstrap, and `workflows-path.ts`
      # answers where the workflow bundle is built from — the harness passes it
      # to `bundleWorkflowCode`, so a wrong answer there fails only this job.
      - 'apps/worker/src/temporal-*.ts'
      - 'apps/worker/src/workflows-path.ts'
      - 'apps/worker/src/workflows/**'
      - 'apps/worker/test/jobs-integration/**'
      - 'apps/worker/vitest.jobs-integration.config.ts'
      - '.github/workflows/jobs-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    name: Jobs Parity / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both results, always. A parity job that stopped at the first red would
      # report "BullMQ failed" and leave the question it exists to answer —
      # whether the other engine failed the same way — unanswered.
      fail-fast: false
      matrix:
        runtime: [bullmq, temporal]
    services:
      redis:
        # Matches docker-compose.yml. Started for both runtimes because a
        # service container cannot be conditioned on a matrix value, and an
        # unused Redis costs a second.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Selected the way a deployment selects it, not through a flag only the
      # tests know about.
      WORKER_RUNTIME: ${{ matrix.runtime }}
      JOBS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      # Temporal is not a service container here, and that is a deviation from
      # the spec's wording worth stating: §8.3 says "a real Temporal container".
      # `@temporalio/testing` starts a real Temporal server (the CLI dev server,
      # Server 1.32 at the time of writing) from a cached binary, which is the
      # same engine without `auto-setup`'s Postgres, seeds and readiness dance —
      # and it is how a developer runs this suite on a laptop, since Phase E
      # deleted Temporal from `docker-compose.yml` on purpose. Point
      # JOBS_TEST_TEMPORAL_ADDRESS at a container to override.
      - run: npm run worker:test:jobs
