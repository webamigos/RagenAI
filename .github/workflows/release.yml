name: Create release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm clean-install

      # Scoped to the root's own dependency closure. Docusaurus (apps/docs)
      # aliases `react-loadable` to `npm:@docusaurus/react-loadable@6.0.0`, and
      # `npm audit signatures` asks the registry for the *key* name at that
      # version — `react-loadable@6.0.0`, which does not exist — so an
      # unscoped run fails with ETARGET and takes the release with it.
      #
      # This verifies 710 packages; what it gives up is the docs site's own
      # webpack/babel tree, which ships to a static nginx image and never runs
      # in the product. Revisit if npm learns to resolve aliases here.
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures --workspaces=false --include-workspace-root

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
