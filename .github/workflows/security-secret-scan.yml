name: Secret Scan (trufflehog)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

concurrency:
  # Pull requests share a group per ref, so a follow-up push cancels the
  # run it superseded. Everything else — a push to main, a schedule — gets
  # a group of its own via run_id. Sharing one with cancel-in-progress off
  # does not run them in parallel: GitHub queues the second as pending and
  # cancels any earlier pending run, so two quick pushes to main would lose
  # the middle result instead of recording it.
  group: security-secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
