name: Run migrations for Production

env:
  DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
  DATABASE_DIRECT_URL: ${{ secrets.PROD_DATABASE_DIRECT_URL }}
  SUPABASE_API_URL: ${{ secrets.PROD_SUPABASE_API_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
  SUPABASE_PROJECT_ID: ${{ secrets.PROD_SUPABASE_PROJECT_ID }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}

on:
  push:
    # paths:
    #   # Only run this workflow when migrations are updated
    #   - prisma/migrations/**
    #   - supabase/migrations/**
    branches: [main]

jobs:
  deploy-on-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

      - name: Apply all pending migrations to the database
        run: npx prisma migrate deploy
