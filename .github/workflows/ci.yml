name: Ragen App

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  OPENAI_API_KEY: 'dummy'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
  DATABASE_DIRECT_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
  CLERK_SECRET_KEY: 'dummy'
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: 'dummy'
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: '/dummy'
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: '/dummy'
  LANGCHAIN_API_KEY: 'dummy'
  LANGCHAIN_ENDPOINT: 'http://example.com'
  LANGCHAIN_PROJECT: 'dummy'
  REDIS_URL: 'http://example.com'
  SECRET_KEY: 'dummy'
  TARGET_ENV: 'ci'

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Optional: Cache node modules to speed up the build process
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

      - name: Run tests
        run: npm run test
