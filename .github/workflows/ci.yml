name: CI/CD for Assistant

env:
  SENTRY_AUTH_TOKEN: ${{ vars.SENTRY_AUTH_TOKEN }}
  OPENAI_API_KEY: 'dummy'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint app
        run: npx nx lint frontend

      - name: Build Next.js app
        run: npx nx build frontend

      - name: Run tests
        run: npx nx test frontend
