name: Publish images

# Container images for the apps that can be published as-is.
#
# Self-hosting today means building them from source: `npm run
# ragen:up:everything` runs `docker compose --build`, so every install compiles
# four images before it can start. This publishes the ones that are the same
# for everybody, which is the spec's G1 and the gate the worker-runtime
# programme's Phase G waits on — `ragen-enterprise` layers the Temporal adapter
# `FROM` the worker image rather than rebuilding the pipeline.
#
# **`web` is here now.** It was the one exclusion, because its Dockerfile took
# ten `NEXT_PUBLIC_*` build arguments and Next inlines those into the client
# bundle — three of them (`APP_URL` and the two Pusher values) differ per
# install, so one image would have carried the publisher's answers into every
# visitor's browser. Those values are read at runtime now; the Dockerfile
# declares no build arguments and an architecture test keeps it that way.
#
# `mcp` is here despite sitting outside this programme, for the same reason:
# no build arguments, same monorepo-root context, and scope is not a reason to
# make somebody compile it.
#
# **Every image is a two-architecture manifest.** It published `linux/amd64`
# alone until 2026-09-19, on the reasoning that no deployment target used
# arm64 and cross-building under QEMU cost several times the build. The first
# half was true of deployment and false of development: a Mac on Apple silicon
# pulls the amd64 variant, runs it under Rosetta, and Docker Desktop flags it
# — and a native module that segfaults under emulation reads as an application
# bug. The second half stopped applying when this repository went public,
# because `ubuntu-24.04-arm` is then a free hosted runner. So each architecture
# is built natively, side by side, and `merge` joins the two digests into one
# tag. Nothing emulates anything.
on:
  release:
    types: [published]
  # So the workflow can be proved before a release depends on it, and re-run
  # when a publish fails for a reason the tag has nothing to do with.
  #
  # **Dispatch it on the tag**, not on a branch with the tag as an input:
  #
  #     gh workflow run publish-images.yml --ref v1.2.3
  #
  # It used to take a `ref` input, which was worse than useless. That input
  # reached `actions/checkout` and nothing else, while `metadata-action` reads
  # `github.ref` — so a dispatch from `main` naming a tag built the tag's code
  # and labelled it with `main`'s sha, produced no semver tags at all, and no
  # `latest` (that one is gated on the event being a release). An image with
  # the wrong version on it is the one outcome worse than no image.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build / ${{ matrix.app }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      # One broken image should not hide whether the others build.
      fail-fast: false
      matrix:
        app: [worker, api, admin, mcp, web]
        # A list of objects rather than a bare `[amd64, arm64]` plus a lookup:
        # the runner label belongs next to the architecture it provides, so
        # adding a third one is one entry and not two edits that have to agree.
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required by `cache-to: type=gha` below, and the reason the first real
      # run of this workflow failed: without it buildx uses the default
      # `docker` driver, which cannot export a cache at all — "Cache export is
      # not supported for the docker driver", raised before a single layer is
      # built. The driver this installs is `docker-container`.
      - uses: docker/setup-buildx-action@v3

      # Here only for the OCI labels. The tags are applied once, by `merge`,
      # to the manifest list — a per-architecture build must push no tag at
      # all, or the two jobs race and whichever finishes last wins the tag
      # with a single-architecture image behind it.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ragen-${{ matrix.app }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          # The monorepo root, for every app: the lockfile lives there and npm
          # resolves the workspace tree from it. Each Dockerfile says so on its
          # first line.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushes the image under its digest and nothing else, which is what
          # leaves `merge` something to join. `name-canonical` is what makes
          # the digest resolvable under the repository name afterwards.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/ragen-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture as well as per app: one scope shared by
          # both would have each build evict the other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.platform.arch }},mode=max

      # The digest is the only thing `merge` needs, and an artifact is the only
      # way to hand it across jobs. The file is named after the digest so two
      # architectures cannot collide inside one download directory — with the
      # `sha256:` prefix stripped, because `merge` puts it back when it builds
      # `image@sha256:<digest>` and a colon in an artifact path is its own
      # argument against keeping it.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish / ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [worker, api, admin, mcp, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ragen-${{ matrix.app }}
          # The action adds `latest` on its own for a semver tag, which with
          # the explicit one below produced `--tag …:latest` twice on the first
          # run. Harmless, and still worth not shipping.
          flavor: latest=false
          # `type=semver` reads the release tag, which semantic-release writes
          # as `vX.Y.Z`. The sha tag is what a rollback pins to, because
          # `latest` moves and a minor tag moves with it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # One manifest list per tag, pointing at both digests. This is the step
      # that makes `docker pull` on an arm64 host get an arm64 image.
      #
      # The arguments are collected into an array rather than interpolated,
      # because the alternative is `$(...)` splitting on whitespace — which
      # works and which shellcheck rejects, and it is the right call: a tag is
      # untrusted enough to deserve a quote.
      - name: Join the per-architecture digests into one tag
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ragen-${{ matrix.app }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      # Cheap, and it is the only thing that would catch a manifest that was
      # written with one architecture in it.
      - name: Check both architectures are in the published manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ragen-${{ matrix.app }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          manifest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' "$IMAGE:$VERSION")
          for arch in amd64 arm64; do
            if ! jq -e --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)' \
              <<< "$manifest" > /dev/null; then
              echo "::error::linux/$arch is missing from the published manifest"
              exit 1
            fi
          done

concurrency:
  # Per tag, so two releases in quick succession do not race to move `latest`.
  group: publish-images-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
