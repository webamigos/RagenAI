name: Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical --omit=dev

concurrency:
  # Pull requests share a group per ref, so a follow-up push cancels the
  # run it superseded. Everything else — a push to main, a schedule — gets
  # a group of its own via run_id. Sharing one with cancel-in-progress off
  # does not run them in parallel: GitHub queues the second as pending and
  # cancels any earlier pending run, so two quick pushes to main would lose
  # the middle result instead of recording it.
  group: security-audit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
