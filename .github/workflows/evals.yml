name: Prompt Evals

on:
  pull_request:
    branches: [dev, main]
    # Paths are repo-root-relative and the app lives in apps/web since ADR-29.
    # A root-relative "src/libs/chains/**" matches nothing and silently disables
    # this gate — which is exactly what happened between ADR-29 and this fix.
    paths:
      - "apps/web/src/libs/chains/**"
      - "apps/web/evals/**"
      - ".github/workflows/evals.yml"

jobs:
  eval-ci:
    name: Run CI Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level so the step `if` below can read them. The previous version set
    # these only on the step, where `if` is evaluated before the step env
    # exists — so the condition was always false and the gate never ran.
    env:
      LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      # A missing secret used to skip this gate and report success, which is how
      # it went months without evaluating a single prompt. Forks genuinely cannot
      # read repository secrets, so there a skip is the only option — but on a PR
      # from this repo an empty secret is a misconfiguration, and the job says so
      # and fails.
      #
      # Compare head.repo.full_name against github.repository rather than reading
      # head.repo.fork: that flag is true for every PR, internal ones included,
      # once the repo itself is a fork of something upstream, which would disable
      # the gate all over again just as silently.
      - name: Check LiteLLM secrets are present
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          missing=""
          if [ -z "${LITELLM_PROXY_URL:-}" ]; then missing="$missing LITELLM_PROXY_URL"; fi
          if [ -z "${LITELLM_MASTER_KEY:-}" ]; then missing="$missing LITELLM_MASTER_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Prompt-eval gate is not configured::Missing repository secret(s):$missing"
            echo "The eval gate cannot grade anything without these, so it fails here"
            echo "rather than skipping and reporting a green check."
            echo
            echo "Add them in Settings -> Secrets and variables -> Actions:"
            echo "  LITELLM_PROXY_URL  base URL of the LiteLLM proxy, no trailing slash"
            echo "  LITELLM_MASTER_KEY proxy master key; the grader routes through it too"
            exit 1
          fi
          echo "Both LiteLLM secrets are present; the eval gate will run."

      # Everything routes through the LiteLLM proxy, including the grader, so
      # LITELLM_* are the only secrets needed. False only on fork PRs, which have
      # no access to secrets; on our own PRs the check above has already failed
      # the job when either secret is empty.
      - name: Run CI evals
        if: env.LITELLM_PROXY_URL != '' && env.LITELLM_MASTER_KEY != ''
        env:
          DEFAULT_MODEL_PROVIDER: litellm
          DEFAULT_MODEL: gemini-2.5-flash
        # eval:ci is defined in apps/web, not at the root, and its --config /
        # --output paths are relative to that workspace.
        run: npm run eval:ci --workspace=@webamigos/ragen-web

      - name: Convert to CTRF
        # hashFiles() and the artifact paths below are always relative to
        # GITHUB_WORKSPACE, never to a step's working directory.
        if: always() && hashFiles('apps/web/evals/results/ci-results.json') != ''
        run: node apps/web/evals/scripts/promptfoo-to-ctrf.mjs apps/web/evals/results/ci-results.json ctrf/eval-results.json

      - name: Publish Eval Results
        if: always() && hashFiles('ctrf/eval-results.json') != ''
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/eval-results.json'
          summary-delta-report: true
          fail-rate-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: apps/web/evals/results/
          retention-days: 30
