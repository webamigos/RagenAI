name: Prompt Evals

on:
  pull_request:
    branches: [main]
    paths:
      - "src/libs/chains/**"
      - "evals/**"

jobs:
  eval-ci:
    name: Run CI Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level so the step `if` below can read them. The previous version set
    # these only on the step, where `if` is evaluated before the step env
    # exists — so the condition was always false and the gate never ran.
    env:
      LITELLM_PROXY_URL: ${{ secrets.LITELLM_PROXY_URL }}
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      # Everything routes through the LiteLLM proxy, including the grader, so
      # LITELLM_* are the only secrets needed. Skipped (not failed) when the
      # proxy isn't configured, e.g. on forks without access to secrets.
      - name: Run CI evals
        if: env.LITELLM_PROXY_URL != '' && env.LITELLM_MASTER_KEY != ''
        env:
          DEFAULT_MODEL_PROVIDER: litellm
          DEFAULT_MODEL: gemini-2.5-flash
        run: npm run eval:ci

      - name: Convert to CTRF
        if: always() && hashFiles('evals/results/ci-results.json') != ''
        run: node evals/scripts/promptfoo-to-ctrf.mjs evals/results/ci-results.json ctrf/eval-results.json

      - name: Publish Eval Results
        if: always() && hashFiles('ctrf/eval-results.json') != ''
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/eval-results.json'
          summary-delta-report: true
          fail-rate-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
