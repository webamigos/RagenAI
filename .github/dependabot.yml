version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Listed first, because a dependency joins the first group it matches.
      # The Temporal SDK is ten packages that pin each other exactly, and it
      # straddles the dependency-type split below: the runtime packages are
      # production dependencies of apps/worker, `testing` and
      # `nyc-test-coverage` are dev dependencies. So `dev-dependencies` moved
      # half the family and left the rest pinned ten minors behind (#942).
      # npm resolves that by installing two copies, and typecheck then fails
      # on two nominal types with the same name. They move as a set or not at
      # all — `tests/architecture/the-temporal-family-moves-together.test.ts`
      # holds the invariant itself.
      temporal:
        patterns:
          - "@temporalio/*"
        update-types: [minor, patch]
      # One PR per ecosystem rather than a dozen. Security updates are excluded
      # from grouping below so they always arrive as their own PR.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Majors for the framework core land deliberately, not on a schedule.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/*"
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: chore
