services:
  postgres:
    image: postgres:16
    container_name: ragen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ragen-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: ragen-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - ragen-network

  temporal-ui:
    image: temporalio/ui:2.36.0
    container_name: ragen-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    networks:
      - ragen-network

  litellm-postgres:
    image: postgres:16
    container_name: ragen-litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm123}
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
    ports:
      - "${LITELLM_DB_PORT:-5433}:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ragen-litellm
    restart: unless-stopped
    depends_on:
      litellm-postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      # These override .env.local — internal Docker networking values
      LITELLM_DATABASE_URL: "postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-litellm123}@litellm-postgres:5432/${LITELLM_DB_NAME:-litellm}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev-key}
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - ragen-network

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    container_name: ragen-docling
    restart: unless-stopped
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "5001"
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_NUM_THREADS: "4"
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ragen-network

  presidio-analyzer:
    build:
      context: ./presidio
      dockerfile: Dockerfile.analyzer
    container_name: ragen-presidio-analyzer
    restart: unless-stopped
    ports:
      - "${PRESIDIO_ANALYZER_PORT:-5002}:3000"
    environment:
      ANALYZER_CONF_FILE: presidio_analyzer/conf/default_analyzer.yaml
      RECOGNIZER_REGISTRY_CONF_FILE: presidio_analyzer/conf/default_recognizers.yaml
      NLP_CONF_FILE: presidio_analyzer/conf/default.yaml
    networks:
      - ragen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: ragen-presidio-anonymizer
    restart: unless-stopped
    ports:
      - "${PRESIDIO_ANONYMIZER_PORT:-5003}:3000"
    networks:
      - ragen-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional — only needed for API rate limiting
  redis:
    image: redis:7-alpine
    container_name: ragen-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

volumes:
  postgres_data:
    name: ragen-postgres-data
  redis_data:
    name: ragen-redis-data
  qdrant_data:
    name: ragen-qdrant-data
  litellm_postgres_data:
    name: ragen-litellm-postgres-data

networks:
  ragen-network:
    name: ragen-network
    driver: bridge
