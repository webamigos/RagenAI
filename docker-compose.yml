version: "3"
services:
  postgres:
    image: postgres
    container_name: ragen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  redis:
    image: redis:7-alpine
    container_name: ragen-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ragen-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-ragen-dev-key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
      MEILI_EXPERIMENTAL_VECTOR_STORE: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

volumes:
  postgres_data:
    name: ragen-postgres-data
  redis_data:
    name: ragen-redis-data
  meilisearch_data:
    name: ragen-meilisearch-data

networks:
  ragen-network:
    name: ragen-network
    driver: bridge
