# Container, volume and network names are left to Compose, which prefixes them
# with the project name — the directory this file sits in, unless
# COMPOSE_PROJECT_NAME says otherwise. Two Ragen checkouts in differently named
# directories therefore coexist with no configuration at all.
#
# **Two directories with the same basename would not**, left at the default:
# they produce the same project name, and so the same containers and volumes —
# silently, when the first stack is stopped and no port is held either.
# `create-ragen-app` settles that by writing COMPOSE_PROJECT_NAME into the
# install's `.env`, which Compose reads from this directory on every command,
# so an install made by the wizard is not exposed to it. A checkout made some
# other way is: add that line if this directory's name is already in use.
#
# They used to be pinned (`container_name: ragen-postgres`, `name:` on each
# volume, a fixed network name) so that `docker logs ragen-postgres` and the
# runbooks spelling that name kept working. That readability was real, and it
# cost more than it was worth: the names are global to the Docker daemon, so a
# second install collided on every container name and — the expensive part —
# silently *shared* the postgres and qdrant volumes with the first. Two
# installs, one database, discovered from the inside.
#
# What replaces the readability: `docker compose ps` and `docker compose logs
# postgres`, run from the project directory, which name services rather than
# containers and are correct in every checkout. `docker ps` now shows
# `<directory>-postgres-1`.
#
# What this does NOT fix: published ports. Prefixing names does not move a
# port, so two stacks both publishing 55432 still collide — set POSTGRES_PORT,
# QDRANT_PORT, QDRANT_GRPC_PORT, DOCLING_PORT and REDIS_PORT on the second one,
# plus PRESIDIO_ANALYZER_PORT and PRESIDIO_ANONYMIZER_PORT if it runs
# `--profile pii`, and RUSTFS_PORT and RUSTFS_CONSOLE_PORT with `--profile s3`. (The observability profile publishes three more —
# OTEL_COLLECTOR_GRPC_PORT, OTEL_COLLECTOR_HTTP_PORT, JAEGER_UI_PORT — and a
# plain `up` starts none of them.) create-ragen-app probes the ports it is
# about to publish and names the taken ones before it starts anything.
#
# Published ports bind to loopback, not to every interface. Compose's default
# is 0.0.0.0, which put every service — including ones holding provider
# key, behind a master key whose local default is a constant anyone can read in
# this repository — on the LAN, with a Postgres defaulting to `pass123` beside
# it. Nothing in the stack needs the wider bind: services reach each other by
# name on the compose network, and the apps run on the host. Set
# RAGEN_BIND_ADDR=0.0.0.0 to opt back in deliberately.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget, and CMD-SHELL runs dash, which has
      # no /dev/tcp — call bash directly.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  docling:
    # Pinned to a release rather than :latest — a floating tag lets two nodes
    # run different builds and a rollback doesn't restore the previous image
    # (same reasoning the Helm chart's values.yaml already documents).
    image: ghcr.io/docling-project/docling-serve-cpu:v1.32.0
    restart: unless-stopped
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "5001"
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_NUM_THREADS: "4"
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${DOCLING_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ragen-network

  # Behind a profile: PII masking is opt-in, and these two are the heaviest
  # thing in the stack — the analyzer is a local build carrying spaCy models.
  # A deployment that does not mask should not pay for them, and until this
  # profile existed every `docker compose up` did.
  #
  #   docker compose --profile pii up -d
  #
  # Nothing depends_on them: the apps reach them over HTTP, and only when
  # PRESIDIO_ANALYZER_URL and PRESIDIO_ANONYMIZER_URL are set.
  presidio-analyzer:
    profiles: ['pii']
    build:
      context: ./infra/presidio/analyzer
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${PRESIDIO_ANALYZER_PORT:-5002}:3000"
    environment:
      ANALYZER_CONF_FILE: presidio_analyzer/conf/default_analyzer.yaml
      RECOGNIZER_REGISTRY_CONF_FILE: presidio_analyzer/conf/default_recognizers.yaml
      NLP_CONF_FILE: presidio_analyzer/conf/default.yaml
    networks:
      - ragen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  presidio-anonymizer:
    profiles: ['pii']
    # Presidio moved from Microsoft to the independent Data Privacy Stack org
    # (github.com/data-privacy-stack/presidio) — mcr.microsoft.com/presidio-*
    # is now a frozen legacy registry. Pinned rather than :latest for the same
    # reason as docling above.
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    restart: unless-stopped
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${PRESIDIO_ANONYMIZER_PORT:-5003}:3000"
    networks:
      - ragen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Required. It holds the job queues (ADR-44) as well as the worker's
  # organization-settings cache, so an install without it has no background
  # processing at all — not a degraded rate limiter.
  redis:
    image: redis:7-alpine
    # Two settings the queues depend on, and neither is Redis's default here.
    #
    # `noeviction`: with a memory policy that evicts, Redis drops queue keys
    # under pressure and the jobs go with them — silently, and
    # indistinguishably from work nobody submitted. The worker asserts this at
    # boot and refuses to start against an evicting instance.
    #
    # `appendonly`: without it a restart loses whatever was queued. BullMQ
    # guarantees the message, which is worth nothing if the message is in a
    # volume that forgets.
    command: >-
      redis-server
      --maxmemory-policy noeviction
      --appendonly yes
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  # --- S3-compatible object storage (opt-in) ------------------------------
  # RustFS, for installs that want files in an object store they run
  # themselves instead of the local filesystem (ADR-27). Not started by
  # default; enable with:
  #   docker compose --profile s3 up -d
  # and point the apps at it (create-ragen-app writes these when you choose
  # "RustFS"):
  #   STORAGE_PROVIDER=s3
  #   S3_ENDPOINT_URL=http://localhost:59000   (http://rustfs:9000 from a container)
  #   S3_FORCE_PATH_STYLE=true
  #   S3_BUCKET_NAME=ragen   S3_REGION=us-east-1
  #   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY = RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY
  # The keys come from this directory's `.env` (Compose reads it; the apps read
  # `.env.local`). The defaults below are for a local trial only — anyone can
  # read them here, so set your own before this stack holds real documents.
  rustfs:
    profiles: ['s3']
    # Pinned rather than :latest, like everything else in this file.
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-ragen-local}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-ragen-local-secret}
    ports:
      # 59000/59001, not 9000/9001: the same reason Postgres is on 55432 —
      # a developer machine often already has something on the default.
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${RUSTFS_PORT:-59000}:9000"
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-59001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ragen-network

  # RustFS runs as UID 10001 and a fresh named volume belongs to root, so the
  # server cannot write its first object without this. It exits, and a later
  # `up` starts it again — so the recursive chown runs only on a volume that
  # has never been through it, marked by a file it leaves behind. Everything
  # written after that is written by RustFS, as 10001; walking a store of any
  # size on every start would make startup grow with the data.
  rustfs-volume-init:
    profiles: ['s3']
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - >-
        [ -f /data/.ragen-volume-owned ]
        || { chown -R 10001:10001 /data && touch /data/.ragen-volume-owned
        && chown 10001:10001 /data/.ragen-volume-owned; }
    volumes:
      - rustfs_data:/data

  # Creates the bucket the apps write to, so a first upload does not fail on
  # a store that is up but empty. Idempotent: an existing bucket is left alone.
  rustfs-bucket-init:
    profiles: ['s3']
    image: amazon/aws-cli:2.37.1
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-ragen-local}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-ragen-local-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${S3_BUCKET:-ragen}" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$${S3_BUCKET:-ragen}"
    networks:
      - ragen-network

  # --- Observability (opt-in) -------------------------------------------
  # Not started by default so `docker compose up` stays lean. Enable with:
  #   docker compose --profile observability up -d
  # then point the apps at it: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger
    networks:
      - ragen-network

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - ragen-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rustfs_data:
networks:
  # The key is the name services reference; Compose publishes it as
  # `<project>_ragen-network`. No `name:` here, deliberately — a fixed one is
  # global to the daemon and is half of what made two installs collide.
  ragen-network:
    driver: bridge
