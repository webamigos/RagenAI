# Container, volume and network names are pinned rather than left to
# Compose's own project-name prefixing, so `docker logs ragen-postgres` and
# the runbooks that spell that name keep working. The cost is that the names
# are global to the Docker daemon: a second Ragen checkout on the same
# machine collides on the container names and, worse, silently *shares* the
# postgres and qdrant volumes with the first one.
#
# Published ports bind to loopback, not to every interface. Compose's default
# is 0.0.0.0, which put the LiteLLM proxy — holding the installation's provider
# key, behind a master key whose local default is a constant anyone can read in
# this repository — on the LAN, with a Postgres defaulting to `pass123` beside
# it. Nothing in the stack needs the wider bind: services reach each other by
# name on the compose network, and the apps run on the host. Set
# RAGEN_BIND_ADDR=0.0.0.0 to opt back in deliberately.
#
# RAGEN_STACK_NAME is the way out. It defaults to `ragen`, so an existing
# install keeps every name and every volume it already has; set it to
# anything else (create-ragen-app does, for a second install) and the whole
# stack — containers, volumes, network — moves out of the way of the first.

services:
  postgres:
    image: postgres:16
    container_name: ${RAGEN_STACK_NAME:-ragen}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ${RAGEN_STACK_NAME:-ragen}-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget, and CMD-SHELL runs dash, which has
      # no /dev/tcp — call bash directly.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: ${RAGEN_STACK_NAME:-ragen}-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - ragen-network

  temporal-ui:
    image: temporalio/ui:2.36.0
    container_name: ${RAGEN_STACK_NAME:-ragen}-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${TEMPORAL_UI_PORT:-8080}:8080"
    networks:
      - ragen-network

  litellm-postgres:
    image: postgres:16
    container_name: ${RAGEN_STACK_NAME:-ragen}-litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm123}
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${LITELLM_DB_PORT:-55433}:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  litellm:
    image: ghcr.io/berriai/litellm:v1.99.1
    container_name: ${RAGEN_STACK_NAME:-ragen}-litellm
    restart: unless-stopped
    depends_on:
      litellm-postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      # These override .env.local — internal Docker networking values
      LITELLM_DATABASE_URL: "postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-litellm123}@litellm-postgres:5432/${LITELLM_DB_NAME:-litellm}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev-key}
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - ragen-network

  docling:
    # Pinned to a release rather than :latest — a floating tag lets two nodes
    # run different builds and a rollback doesn't restore the previous image
    # (same reasoning the Helm chart's values.yaml already documents).
    image: ghcr.io/docling-project/docling-serve-cpu:v1.32.0
    container_name: ${RAGEN_STACK_NAME:-ragen}-docling
    restart: unless-stopped
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "5001"
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_NUM_THREADS: "4"
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${DOCLING_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ragen-network

  presidio-analyzer:
    build:
      context: ./infra/presidio/analyzer
      dockerfile: Dockerfile
    container_name: ${RAGEN_STACK_NAME:-ragen}-presidio-analyzer
    restart: unless-stopped
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${PRESIDIO_ANALYZER_PORT:-5002}:3000"
    environment:
      ANALYZER_CONF_FILE: presidio_analyzer/conf/default_analyzer.yaml
      RECOGNIZER_REGISTRY_CONF_FILE: presidio_analyzer/conf/default_recognizers.yaml
      NLP_CONF_FILE: presidio_analyzer/conf/default.yaml
    networks:
      - ragen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  presidio-anonymizer:
    # Presidio moved from Microsoft to the independent Data Privacy Stack org
    # (github.com/data-privacy-stack/presidio) — mcr.microsoft.com/presidio-*
    # is now a frozen legacy registry. Pinned rather than :latest for the same
    # reason as docling/litellm above.
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    container_name: ${RAGEN_STACK_NAME:-ragen}-presidio-anonymizer
    restart: unless-stopped
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${PRESIDIO_ANONYMIZER_PORT:-5003}:3000"
    networks:
      - ragen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional — only needed for API rate limiting
  redis:
    image: redis:7-alpine
    container_name: ${RAGEN_STACK_NAME:-ragen}-redis
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  # --- Observability (opt-in) -------------------------------------------
  # Not started by default so `docker compose up` stays lean. Enable with:
  #   docker compose --profile observability up -d
  # then point the apps at it: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    container_name: ${RAGEN_STACK_NAME:-ragen}-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger
    networks:
      - ragen-network

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ${RAGEN_STACK_NAME:-ragen}-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - ragen-network

volumes:
  postgres_data:
    name: ${RAGEN_STACK_NAME:-ragen}-postgres-data
  redis_data:
    name: ${RAGEN_STACK_NAME:-ragen}-redis-data
  qdrant_data:
    name: ${RAGEN_STACK_NAME:-ragen}-qdrant-data
  litellm_postgres_data:
    name: ${RAGEN_STACK_NAME:-ragen}-litellm-postgres-data

networks:
  ragen-network:
    name: ${RAGEN_STACK_NAME:-ragen}-network
    driver: bridge
