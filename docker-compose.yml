version: "3"
services:
  postgres:
    image: postgres
    container_name: ragen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: ragen-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  # meilisearch:
  #   image: getmeili/meilisearch:v1.36
  #   container_name: ragen-meilisearch
  #   restart: unless-stopped
  #   profiles:
  #     - meilisearch
  #   environment:
  #     MEILI_ENV: development
  #     MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-ragen-dev-key}
  #     MEILI_NO_ANALYTICS: "true"
  #     MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
  #   ports:
  #     - "${MEILISEARCH_PORT:-7700}:7700"
  #   volumes:
  #     - meilisearch_data:/meili_data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - ragen-network

  temporal:
    image: temporalio/auto-setup:latest
    container_name: ragen-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - ragen-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: ragen-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    networks:
      - ragen-network

  litellm-postgres:
    image: postgres
    container_name: ragen-litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm123}
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
    ports:
      - "${LITELLM_DB_PORT:-5433}:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ragen-litellm
    restart: unless-stopped
    depends_on:
      litellm-postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      # These override .env.local — internal Docker networking values
      LITELLM_DATABASE_URL: "postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-litellm123}@litellm-postgres:5432/${LITELLM_DB_NAME:-litellm}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev-key}
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - ragen-network

  # Optional — only needed for API rate limiting
  redis:
    image: redis:7-alpine
    container_name: ragen-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

volumes:
  postgres_data:
    name: ragen-postgres-data
  redis_data:
    name: ragen-redis-data
  qdrant_data:
    name: ragen-qdrant-data
  # meilisearch_data:
  #   name: ragen-meilisearch-data
  litellm_postgres_data:
    name: ragen-litellm-postgres-data

networks:
  ragen-network:
    name: ragen-network
    driver: bridge
