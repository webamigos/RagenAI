description: 'Red team / adversarial prompt tests for RAG chain'

# `model` must be a key in the route table (infra/llm-gateway/routes.yaml, or
# LLM_ROUTES_PATH). The provider resolves it through @ragenai/llm-gateway and
# ignores any other provider hint.
providers:
  - id: 'file://../providers/rag-chain.provider.ts'
    label: 'RAG Chain (gemini-2.5-flash)'
    config:
      model: 'gemini-2.5-flash'

prompts:
  - '{{question}}'

tests: 'file://../datasets/red-team.yaml'

defaultTest:
  options:
    # The grader is promptfoo's own model call, not the product's — it does
    # not go through @ragenai/llm-gateway, so it needs an endpoint of its own.
    # OpenAI by default; EVAL_GRADER_BASE_URL points it elsewhere.
    provider:
      id: 'openai:chat:gemini-2.5-flash'
      config:
        apiBaseUrl: '{{ env.EVAL_GRADER_BASE_URL | default("https://api.openai.com/v1") }}'
        apiKeyEnvar: OPENAI_API_KEY

# Relative to the working directory, NOT to this file (unlike file:// above).
outputPath: 'evals/results/red-team.json'
