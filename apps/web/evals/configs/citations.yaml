description: 'Citation precision — does the answer name only the document it drew on? (demo corpus)'

# `model` must be a model_name from infra/litellm/config.yaml — the provider always
# routes through the LiteLLM proxy and ignores any other provider hint.
providers:
  - id: 'file://../providers/rag-chain.provider.ts'
    label: 'RAG Chain, demo corpus (gemini-2.5-flash)'
    config:
      model: 'gemini-2.5-flash'
      corpus: 'demo-corpus'

prompts:
  - '{{question}}'

tests: 'file://../datasets/citations.yaml'

defaultTest:
  options:
    # Grade through LiteLLM as well, so evals need no provider key of their own.
    provider:
      id: 'openai:chat:gemini-2.5-flash'
      config:
        apiBaseUrl: '{{ env.LITELLM_PROXY_URL }}/v1'
        apiKeyEnvar: LITELLM_MASTER_KEY

# Relative to the working directory, NOT to this file (unlike file:// above).
outputPath: 'evals/results/citations.json'
