# Citation precision over the demo tenant's corpus.
#
# Three documents, one answer per question, and the whole corpus fits in one
# retrieval — so every question retrieves all three files. That is exactly the
# shape that made the analytics screen count three citations for an answer
# naming one file. Each case asserts the answer credits the one document that
# holds the answer and neither of the other two.
#
# **Assert on `metadata.citedFiles`, not on the answer text.** These cases used
# to look for the file name in prose, because the answer prompt asked for
# `According to 'file.md', …` and that sentence was the only record of a
# citation. Since the marker change the prompt asks the model to cite by number
# and `cited-sources.ts` reads `[n]` first, falling back to names only when an
# answer carries no markers. The suite kept scoring the old contract and so
# failed three of four cases while attribution was in fact correct in all four
# — a suite reporting a regression that did not exist, which is worse than no
# suite. `metadata.citedFiles` is the value that reaches `DocumentCitation`,
# so asserting on it is asserting on the number the dashboard shows.

- description: 'The demo question that showed three citations for one source'
  vars:
    question: 'how quickly ticket is answered?'
  assert:
    - type: javascript
      value: |
        const cited = context.metadata?.citedFiles ?? [];
        return cited.length === 1 && cited[0].startsWith('Sample FAQ — support and availability');
    - type: icontains-any
      value: ['one business day', 'four business hours']

- description: 'Answer that lives only in the handbook'
  vars:
    question: 'Do I need approval for a 300 PLN expense?'
  assert:
    - type: javascript
      value: |
        const cited = context.metadata?.citedFiles ?? [];
        return cited.length === 1 && cited[0].startsWith('Sample handbook — expenses and travel');
    - type: llm-rubric
      value: 'Says that an expense of 300 PLN needs no prior approval'

- description: 'Answer that lives only in the product overview'
  vars:
    # Worded with the section's own terms ("indexed", "retrieval"): the mock
    # store scores by keyword overlap, and "search my documents" landed on the
    # intro paragraph instead — a retrieval miss, which this suite does not
    # measure (README: it is not a retrieval test).
    question: 'How are documents indexed for retrieval?'
  assert:
    - type: javascript
      value: |
        const cited = context.metadata?.citedFiles ?? [];
        return cited.length === 1 && cited[0].startsWith('Ragen — product overview');
    - type: llm-rubric
      value: 'Explains that each document is indexed twice — by meaning and by wording — and the results are merged'

- description: 'No document holds the answer, so nothing may be cited'
  vars:
    question: 'What is the office Wi-Fi password?'
  assert:
    - type: javascript
      value: '(context.metadata?.citedFiles ?? []).length === 0'
    - type: llm-rubric
      value: 'Says the information is not in the provided documents, without inventing a password'
