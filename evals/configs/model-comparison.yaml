description: "Cross-model quality comparison for RAG chain"

providers:
  - id: "file://providers/rag-chain.provider.ts"
    label: "GPT-4o (OpenRouter)"
    config:
      provider: "openrouter"
      model: "openai/gpt-4o"

  - id: "file://providers/rag-chain.provider.ts"
    label: "Claude Sonnet (OpenRouter)"
    config:
      provider: "openrouter"
      model: "anthropic/claude-sonnet-4-6"

  - id: "file://providers/rag-chain.provider.ts"
    label: "Gemini Flash (OpenRouter)"
    config:
      provider: "openrouter"
      model: "google/gemini-2.5-flash-preview"

prompts:
  - "{{question}}"

tests: "file://../datasets/model-comparison.yaml"

defaultTest:
  options:
    provider: "openai:chat:gpt-4o"

outputPath: "../results/model-comparison.json"
