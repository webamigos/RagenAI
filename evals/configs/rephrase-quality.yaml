description: "Rephrase chain quality tests"

providers:
  - id: "file://providers/rephrase.provider.ts"
    label: "Rephrase (GPT-4o)"
    config:
      provider: "openrouter"
      model: "openai/gpt-4o"

prompts:
  - "{{question}}"

tests: "file://../datasets/rephrase-quality.yaml"

defaultTest:
  options:
    provider: "openai:chat:gpt-4o"

outputPath: "../results/rephrase-quality.json"
