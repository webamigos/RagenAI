description: "RAG chain answer quality regression tests"

providers:
  - id: "file://providers/rag-chain.provider.ts"
    label: "RAG Chain (GPT-4o)"
    config:
      provider: "openrouter"
      model: "openai/gpt-4o"

prompts:
  - "{{question}}"

tests: "file://../datasets/rag-quality.yaml"

defaultTest:
  options:
    provider: "openai:chat:gpt-4o"

outputPath: "../results/rag-quality.json"
