{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ragen.serviceAccountName" . }}
  labels:
    {{- include "ragen.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The apps talk to Postgres, Qdrant and Temporal — never to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
