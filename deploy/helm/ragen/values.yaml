# Ragen — default values.
#
# The chart ships a working self-hosted deployment out of the box: Postgres,
# Qdrant, Redis and Temporal all run in-cluster. For a managed setup, set
# `<service>.enabled: false` and point the matching URL in `config` at your
# provider. Nothing else changes.

nameOverride: ''
fullnameOverride: ''

image:
  # Every app is built from the same repository, so they share a registry and
  # tag by default. Override per app under `apps.<name>.image`.
  registry: ghcr.io/webamigos
  tag: '' # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ''
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ['ALL']
  readOnlyRootFilesystem: false

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
# `worker` has no port: it is a Temporal worker and only makes outbound
# connections, so it gets a Deployment and no Service.
# Schema migrations run as a pre-install/pre-upgrade hook, using the web image
# (it already carries prisma/ and the CLI). Turn this off if migrations are
# applied out of band — from CI, or by someone holding DDL credentials the
# app itself does not have.
migrations:
  enabled: true
  # One retry. A migration that fails twice is failing for a reason retrying
  # will not fix, and the release should stop rather than loop.
  backoffLimit: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

apps:
  web:
    enabled: true
    replicas: 2
    port: 3000
    image: {} # {repository, tag}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    env: {}
  api:
    enabled: true
    replicas: 2
    port: 3001
    image: {}
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 768Mi }
    env: {}
  admin:
    enabled: true
    replicas: 1
    port: 3200
    image: {}
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 512Mi }
    env: {}
  docs:
    enabled: false
    replicas: 1
    port: 3000
    image: {}
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
    env: {}
  worker:
    enabled: true
    replicas: 1
    port: null
    image: {}
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 2Gi }
    env: {}

# ---------------------------------------------------------------------------
# Supporting services (stateless)
# ---------------------------------------------------------------------------
litellm:
  enabled: true
  image: ghcr.io/berriai/litellm:v1.83.10-stable
  port: 4000
  replicas: 1
  # The proxy reads its model list from a file. Provide it here and the chart
  # mounts it as a ConfigMap; leave empty to mount nothing and let the image
  # use its own default.
  config: ''
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

docling:
  enabled: true
  image: ghcr.io/docling-project/docling-serve-cpu:latest
  port: 5001
  replicas: 1
  # Docling loads models at boot and parses documents on CPU — it is the
  # heaviest supporting service by a wide margin.
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 4Gi }

presidio:
  analyzer:
    enabled: true
    # Built from infra/presidio/analyzer — it adds Polish recognisers, so the
    # upstream image will not do.
    image: ghcr.io/webamigos/ragen-presidio-analyzer:latest
    port: 3000
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
  anonymizer:
    enabled: true
    image: mcr.microsoft.com/presidio-anonymizer:latest
    port: 3000
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 512Mi }

# ---------------------------------------------------------------------------
# Stateful dependencies
# ---------------------------------------------------------------------------
# Set `enabled: false` and point the matching entry in `config` at a managed
# instance. The chart never migrates data between the two.
postgres:
  enabled: true
  image: postgres:16
  port: 5432
  auth:
    username: postgres
    database: ragen
    # Leave empty and the chart generates one on first install, storing it in
    # the release Secret. Set it explicitly for anything you plan to restore.
    password: ''
  persistence:
    size: 20Gi
    storageClass: ''
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.17.1
  port: 6333
  grpcPort: 6334
  persistence:
    size: 20Gi
    storageClass: ''
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 4Gi }

redis:
  # Optional — API rate limiting only. The apps run without it.
  enabled: false
  image: redis:7-alpine
  port: 6379
  persistence:
    size: 1Gi
    storageClass: ''
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

temporal:
  enabled: true
  image: temporalio/auto-setup:1.26.2
  port: 7233
  namespace: default
  ui:
    enabled: true
    image: temporalio/ui:2.36.0
    port: 8080
  # Temporal keeps its own state in Postgres. With the bundled Postgres it
  # uses that instance; point these elsewhere for a managed one, or disable
  # the whole block and use Temporal Cloud via config.TEMPORAL_SERVER_ADDRESS.
  database:
    host: '' # defaults to the bundled Postgres service
    port: 5432
    user: postgres
    password: '' # defaults to postgres.auth.password
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
# Non-secret values, rendered into a ConfigMap and injected into every app.
# URLs for the bundled services are filled in by the chart when you leave them
# empty — set them only when pointing at something outside the cluster.
config:
  TARGET_ENV: production
  NODE_ENV: production
  DEFAULT_MODEL_PROVIDER: litellm
  DEFAULT_MODEL: gemini-3-flash-preview
  REPHRASE_MODEL: gemini-2.5-flash
  SUMMARY_MODEL: gemini-2.5-flash
  EMBEDDINGS_MODEL: bge-multilingual-gemma2
  VECTOR_SIZE: '3584'
  DOCUMENT_PARSER: docling
  # Set to 1 so a Docling failure fails the ingest instead of falling back to
  # an external model. See apps/docs/docs/self-hosting.md.
  DOCLING_STRICT: '1'
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_PATH: /data/storage

  # Left empty on purpose — the chart points these at the bundled services.
  DATABASE_URL: ''
  QDRANT_URL: ''
  REDIS_URL: ''
  LITELLM_PROXY_URL: ''
  DOCLING_URL: ''
  PRESIDIO_ANALYZER_URL: ''
  PRESIDIO_ANONYMIZER_URL: ''
  TEMPORAL_SERVER_ADDRESS: ''
  # Public URLs. Set these — sign-in links and OAuth callbacks are built from
  # them, and there is no sensible default.
  BETTER_AUTH_URL: ''
  NEXT_PUBLIC_APP_URL: ''

# Rendered into a Secret. Every value here is optional at install time so the
# chart deploys without them, but the app will report the missing ones on its
# first-run screen rather than crashing.
secrets:
  BETTER_AUTH_SECRET: ''
  SECRET_KEY: ''
  LITELLM_MASTER_KEY: ''
  INTERNAL_API_SECRET: ''
  SESSION_AUTH_SECRET: ''
  WORKER_SECRET_KEY: ''
  OPENAI_API_KEY: ''
  GOOGLE_API_KEY: ''
  SCW_API_KEY: ''
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''

# Use an existing Secret instead of the one this chart renders. When set, the
# `secrets` block above is ignored — which is what you want with External
# Secrets Operator or a cloud secret manager.
existingSecret: ''

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
  tls: []
  # Each entry routes a host to one app.
  hosts: []
  #  - host: app.example.com
  #    app: web
  #  - host: admin.example.com
  #    app: admin

# Uploaded documents when STORAGE_PROVIDER=local. Shared between web and
# worker, so it needs ReadWriteMany; switch to S3-compatible storage instead
# if your cluster has no such StorageClass.
storage:
  enabled: true
  size: 50Gi
  storageClass: ''
  accessMode: ReadWriteMany

nodeSelector: {}
tolerations: []
affinity: {}
