# Ragen — default values.
#
# The chart ships a working self-hosted deployment out of the box: Postgres,
# Qdrant and Redis all run in-cluster. For a managed setup, set
# `<service>.enabled: false` and point the matching URL in `config` at your
# provider. Nothing else changes.

nameOverride: ''
fullnameOverride: ''

image:
  # Every app is built from the same repository, so they share a registry and
  # tag by default. Override per app under `apps.<name>.image`.
  registry: ghcr.io/webamigos
  tag: '' # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ''
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ['ALL']
  readOnlyRootFilesystem: false

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------
# `worker` has no port: it consumes queues and only makes outbound
# connections, so it gets a Deployment and no Service. The queue dashboard is
# the exception and is off unless WORKER_ADMIN_USER and WORKER_ADMIN_PASSWORD
# are both set.
# Schema migrations run as a pre-install/pre-upgrade hook, using the web image
# (it already carries prisma/ and the CLI). Turn this off if migrations are
# applied out of band — from CI, or by someone holding DDL credentials the
# app itself does not have.
migrations:
  enabled: true
  # One retry. A migration that fails twice is failing for a reason retrying
  # will not fix, and the release should stop rather than loop.
  backoffLimit: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

apps:
  web:
    enabled: true
    replicas: 2
    port: 3000
    image: {} # {repository, tag}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    env: {}
  api:
    enabled: true
    replicas: 2
    port: 3001
    image: {}
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 768Mi }
    env: {}
  admin:
    enabled: true
    replicas: 1
    port: 3200
    image: {}
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 512Mi }
    env: {}
  docs:
    enabled: false
    replicas: 1
    port: 3000
    image: {}
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
    env: {}
  worker:
    enabled: true
    replicas: 1
    port: null
    image: {}
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 2Gi }
    env: {}

# ---------------------------------------------------------------------------
# Supporting services (stateless)
# ---------------------------------------------------------------------------
docling:
  enabled: true
  # Pinned to a release rather than :latest — with pullPolicy IfNotPresent a
  # floating tag lets two nodes run different builds, and a rollback does not
  # restore the previous image.
  image: ghcr.io/docling-project/docling-serve-cpu:v1.32.0
  # Verified by running the image with these restrictions applied.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ['ALL']
    seccompProfile:
      type: RuntimeDefault
  port: 5001
  replicas: 1
  # Docling loads models at boot and parses documents on CPU — it is the
  # heaviest supporting service by a wide margin.
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 4Gi }

# PII masking. Off by default, matching the application: the worker enables it
# only when FEATURE_FLAG_PII_MASKING=1, and its own comment notes that Presidio
# is two extra containers most deployments do not need. Turn both on together
# with that flag in `config`.
presidio:
  analyzer:
    enabled: false
    # No upstream image exists for this one. It adds Polish recognisers, so the
    # stock presidio-analyzer will not do — compose builds it from
    # infra/presidio/analyzer, and a cluster install needs it built and pushed
    # somewhere the nodes can pull from. Set that reference here.
    image: ghcr.io/webamigos/ragen-presidio-analyzer:latest
    # Not validated by running it — both Presidio services are off by
    # default. Relax this if the image turns out to need a capability.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ['ALL']
      seccompProfile:
        type: RuntimeDefault
    port: 3000
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
  anonymizer:
    enabled: false
    # Presidio moved from Microsoft to the independent Data Privacy Stack org
    # (github.com/data-privacy-stack/presidio) — mcr.microsoft.com/presidio-*
    # is now a frozen legacy registry that stopped receiving new releases.
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    # Not validated by running it — both Presidio services are off by
    # default. Relax this if the image turns out to need a capability.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ['ALL']
      seccompProfile:
        type: RuntimeDefault
    port: 3000
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 512Mi }

# ---------------------------------------------------------------------------
# Stateful dependencies
# ---------------------------------------------------------------------------
# Set `enabled: false` and point the matching entry in `config` at a managed
# instance. The chart never migrates data between the two.
postgres:
  enabled: true
  image: postgres:16
  # The entrypoint starts as root and drops to the postgres user, then fixes
  # ownership of the data directory. Dropping these five as well makes it fail
  # with 'failed switching to postgres' — verified, not assumed.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ['ALL']
      add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETGID', 'SETUID']
    seccompProfile:
      type: RuntimeDefault
  port: 5432
  auth:
    username: postgres
    database: ragen
    # Leave empty and the chart generates one on first install, storing it in
    # the release Secret. Set it explicitly for anything you plan to restore.
    password: ''
  persistence:
    size: 20Gi
    storageClass: ''
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.17.1
  # Verified by running the image with these restrictions applied.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ['ALL']
    seccompProfile:
      type: RuntimeDefault
  port: 6333
  grpcPort: 6334
  persistence:
    size: 20Gi
    storageClass: ''
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 4Gi }

redis:
  # Required. It holds the job queues (ADR-44) as well as the worker's
  # organization-settings cache, so an install without it has no background
  # processing — no ingest, no scraping, no document generation. It was
  # optional while Temporal carried the jobs and Redis carried only rate
  # limiting.
  #
  # The deployment sets `maxmemory-policy noeviction` and appendonly: an
  # evicting Redis drops queue keys under pressure and the jobs go with them,
  # silently, and the worker refuses to start against one.
  enabled: true
  image: redis:7-alpine
  # setpriv needs these to drop to the redis user; without them the entrypoint
  # fails with 'setresuid failed' — verified, not assumed.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ['ALL']
      add: ['SETGID', 'SETUID']
    seccompProfile:
      type: RuntimeDefault
  port: 6379
  persistence:
    size: 1Gi
    storageClass: ''
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
# Non-secret values, rendered into a ConfigMap and injected into every app.
# URLs for the bundled services are filled in by the chart when you leave them
# empty — set them only when pointing at something outside the cluster.
config:
  TARGET_ENV: production
  NODE_ENV: production
  DEFAULT_MODEL_PROVIDER: litellm
  DEFAULT_MODEL: gemini-3-flash-preview
  REPHRASE_MODEL: gemini-2.5-flash
  SUMMARY_MODEL: gemini-2.5-flash
  EMBEDDINGS_MODEL: bge-multilingual-gemma2
  VECTOR_SIZE: '3584'
  DOCUMENT_PARSER: docling
  # Set to 1 so a Docling failure fails the ingest instead of falling back to
  # an external model. See apps/docs/docs/self-hosting.md.
  DOCLING_STRICT: '1'
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_PATH: /data/storage

  # Left empty on purpose — the chart points these at the bundled services.
  DATABASE_URL: ''
  QDRANT_URL: ''
  REDIS_URL: ''
  DOCLING_URL: ''
  PRESIDIO_ANALYZER_URL: ''
  PRESIDIO_ANONYMIZER_URL: ''
  # Set both only to run background jobs on Temporal instead of BullMQ
  # (ADR-44). The chart no longer deploys a Temporal server; this points at one
  # you run yourself, and the worker and the apps must agree on the runtime.
  # The published worker image cannot serve this runtime — it ships no Temporal
  # SDK and says so at boot. See the README before setting it.
  WORKER_RUNTIME: ''
  TEMPORAL_SERVER_ADDRESS: ''
  # Public URLs. Set these — sign-in links and OAuth callbacks are built from
  # them, and there is no sensible default.
  BETTER_AUTH_URL: ''
  NEXT_PUBLIC_APP_URL: ''

# Rendered into a Secret. Every value here is optional at install time so the
# chart deploys without them, but the app will report the missing ones on its
# first-run screen rather than crashing.
secrets:
  BETTER_AUTH_SECRET: ''
  SECRET_KEY: ''
  INTERNAL_API_SECRET: ''
  SESSION_AUTH_SECRET: ''
  WORKER_SECRET_KEY: ''
  OPENAI_API_KEY: ''
  GOOGLE_API_KEY: ''
  SCW_API_KEY: ''
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''

# Use an existing Secret instead of the one this chart renders. When set, the
# `secrets` block above is ignored — which is what you want with External
# Secrets Operator or a cloud secret manager.
existingSecret: ''
# Hash of the external Secret's contents, when `existingSecret` is set. The
# chart cannot read that Secret, so it cannot notice a rotated key; passing a
# hash here rolls the pods when one changes. Any stable value derived from the
# contents works — see deploy/terraform, which passes a sha256 of the map.
existingSecretChecksum: ''

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
  tls: []
  # Each entry routes a host to one app.
  hosts: []
  #  - host: app.example.com
  #    app: web
  #  - host: admin.example.com
  #    app: admin

# Uploaded documents when STORAGE_PROVIDER=local. Shared between web and
# worker, so it needs ReadWriteMany; switch to S3-compatible storage instead
# if your cluster has no such StorageClass.
storage:
  enabled: true
  size: 50Gi
  storageClass: ''
  accessMode: ReadWriteMany

nodeSelector: {}
tolerations: []
affinity: {}
