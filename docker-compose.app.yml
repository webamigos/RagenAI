version: "3"

# Lightweight compose for developing the app without document processing.
# Excludes: Temporal, Temporal UI, Docling.
# Includes Qdrant for RAG retrieval (querying existing knowledge base).
# Usage: docker compose -f docker-compose.app.yml up

services:
  postgres:
    image: postgres:16
    container_name: ragen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ragen-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  litellm-postgres:
    image: postgres
    container_name: ragen-litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm123}
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
    ports:
      - "${LITELLM_DB_PORT:-5433}:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.3-stable
    container_name: ragen-litellm
    restart: unless-stopped
    depends_on:
      litellm-postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      LITELLM_DATABASE_URL: "postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:-litellm123}@litellm-postgres:5432/${LITELLM_DB_NAME:-litellm}"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev-key}
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - ragen-network

volumes:
  postgres_data:
    name: ragen-postgres-data
  qdrant_data:
    name: ragen-qdrant-data
  litellm_postgres_data:
    name: ragen-litellm-postgres-data

networks:
  ragen-network:
    name: ragen-network
    driver: bridge
