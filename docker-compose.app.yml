# Lightweight compose for developing the app without document processing.
# Excludes Docling, and therefore document ingest — and Redis, so no background
# jobs either. Includes Qdrant for RAG retrieval (querying an existing
# knowledge base).
# Usage: docker compose -f docker-compose.app.yml up

# Names are left to Compose's own project prefixing, for the reasons
# docker-compose.yml spells out at length: pinned names are global to the
# Docker daemon, so a second checkout collided on them and shared this file's
# postgres and qdrant volumes with the first. Two things prefixing does not
# solve — set POSTGRES_PORT and QDRANT_PORT on a second stack, and
# COMPOSE_PROJECT_NAME if its directory has the same basename as the first.
#
# Published ports bind to loopback, not to every interface. Compose's default
# is 0.0.0.0, which put every service — including ones holding provider
# key, behind a master key whose local default is a constant anyone can read in
# this repository — on the LAN, with a Postgres defaulting to `pass123` beside
# it. Nothing in the stack needs the wider bind: services reach each other by
# name on the compose network, and the apps run on the host. Set
# RAGEN_BIND_ADDR=0.0.0.0 to opt back in deliberately.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-ragen}
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${RAGEN_BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragen-network

volumes:
  postgres_data:
  qdrant_data:
networks:
  ragen-network:
    driver: bridge
