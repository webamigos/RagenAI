description: 'Ragen LLM Evals — default config (RAG answer quality)'

# `model` must be a model_name from litellm/config.yaml — the provider always
# routes through the LiteLLM proxy and ignores any other provider hint.
providers:
  - id: 'file://evals/providers/rag-chain.provider.ts'
    label: 'RAG Chain (gemini-2.5-flash)'
    config:
      model: 'gemini-2.5-flash'

prompts:
  - '{{question}}'

tests: 'file://evals/datasets/rag-quality.yaml'

defaultTest:
  options:
    # Grade through LiteLLM as well, so evals need no provider key of their own.
    provider:
      id: 'openai:chat:gemini-2.5-flash'
      config:
        apiBaseUrl: '{{ env.LITELLM_PROXY_URL }}/v1'
        apiKeyEnvar: LITELLM_MASTER_KEY

outputPath: 'evals/results/default.json'
